name: one-shot-nested-registry-locator

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: one-shot-nested-registry-locator
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python scripts/one_shot_registry_locator_fix.py
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_transaction_decision_brief.py
      - name: Run full pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-locator-pytest-output
          path: pytest-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
      - run: python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - run: git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/intelligence/transaction_decision_brief.py tests/test_transaction_decision_brief.py
          git commit -m 'Use checkout-independent decision brief registry locator'
          git push origin HEAD:feature/global-trade-copilot-v2
