name: temporary-codex-followup

on:
  pull_request:
    branches:
      - fix/post-merge-hardening

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-merge-hardening
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply Codex follow-up remediation
        run: python scripts/tmp_fix_codex_followup.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_latest_review_followups.py
          tests/test_single_transaction_pipeline.py
          tests/test_copilot_scenarios.py
          tests/test_transaction_capacity.py
          tests/test_answer_validation.py
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Compile and import applications
        run: |
          python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
          python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - name: Validate intended diff
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'src/intelligence/single_transaction_pipeline.py',
            'src/copilot_scenarios.py',
            'src/intelligence/transaction_capacity.py',
            'tests/test_latest_review_followups.py'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          if (-not $changed) { throw 'No follow-up changes were produced.' }
      - name: Commit verified follow-up
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/intelligence/single_transaction_pipeline.py src/copilot_scenarios.py src/intelligence/transaction_capacity.py tests/test_latest_review_followups.py
          git commit -m 'Preserve grounding and non-registry records'
          git push origin HEAD:fix/post-merge-hardening
