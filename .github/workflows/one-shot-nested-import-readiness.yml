name: one-shot-nested-import-readiness

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: one-shot-nested-import-readiness
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: python scripts/one_shot_import_cost_readiness_fix.py
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_copilot_scenarios.py tests/test_copilot_import_cost_execution.py
      - name: Run tests except final repository-state readiness gate
        shell: bash
        run: |
          python -m pytest -q --ignore=tests/test_competition_readiness.py 2>&1 | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-readiness-pytest-output
          path: pytest-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
      - run: python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - run: git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/copilot_scenarios.py tests/test_copilot_scenarios.py
          git commit -m 'Block unexecutable import-cost scenario candidates'
          git push origin HEAD:feature/global-trade-copilot-v2
