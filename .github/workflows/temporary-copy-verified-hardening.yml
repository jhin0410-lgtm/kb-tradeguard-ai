name: temporary-copy-verified-hardening

on:
  pull_request:
    branches:
      - fix/post-merge-hardening

permissions:
  contents: write

jobs:
  transfer-and-verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-merge-hardening
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Copy verified files from validated feature commit
        shell: pwsh
        run: |
          git fetch origin feature/global-trade-copilot-v2
          git checkout 8b6ecbef6a0a5c5611d0570b8ae414b0772413a7 -- `
            competition_app.py `
            streamlit_app.py `
            src/official_data_hub.py `
            src/official_case_studies.py `
            src/copilot_scenarios.py `
            src/intelligence/transaction_capacity.py `
            src/intelligence/single_transaction_pipeline.py `
            src/intelligence/portfolio_assessment.py `
            data/case_studies/official_context_snapshots_v1.json `
            tests/test_latest_review_followups.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run focused review regressions
        run: >-
          python -m pytest -q
          tests/test_latest_review_followups.py
          tests/test_official_data_hub.py
          tests/test_transaction_capacity.py
          tests/test_portfolio_assessment.py
          tests/test_single_transaction_pipeline.py
          tests/test_official_case_studies.py
          tests/test_copilot_scenarios.py
          tests/test_competition_app.py
          tests/test_public_entrypoint_sections.py
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Compile and import applications
        run: |
          python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
          python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - name: Validate intended diff
        shell: pwsh
        run: |
          $changed = git diff --name-only HEAD
          $allowed = @(
            'competition_app.py',
            'streamlit_app.py',
            'src/official_data_hub.py',
            'src/official_case_studies.py',
            'src/copilot_scenarios.py',
            'src/intelligence/transaction_capacity.py',
            'src/intelligence/single_transaction_pipeline.py',
            'src/intelligence/portfolio_assessment.py',
            'data/case_studies/official_context_snapshots_v1.json',
            'tests/test_latest_review_followups.py'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected changed path: $path" }
          }
          if (-not $changed) { throw 'No hardening changes were transferred.' }
      - name: Commit verified hardening transfer
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition_app.py streamlit_app.py src/official_data_hub.py src/official_case_studies.py src/copilot_scenarios.py src/intelligence/transaction_capacity.py src/intelligence/single_transaction_pipeline.py src/intelligence/portfolio_assessment.py data/case_studies/official_context_snapshots_v1.json tests/test_latest_review_followups.py
          git commit -m 'Harden post-merge financial and provenance boundaries'
          git push origin HEAD:fix/post-merge-hardening
