name: temporary-ui-review-fix

on:
  pull_request:
    branches:
      - automation/ui-review-fix-base-v3

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/decision-cockpit-ui-v2
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply reviewed UI fixes
        run: python .internal/apply_ui_review_fixes.py
      - name: Align guided order regression with reviewed call shape
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("tests/test_competition_executive_ui.py")
          source = path.read_text(encoding="utf-8")
          old = '    decision = source.index("model = _render_decision_stage(\\n            run,")\n'
          new = '    decision = source.index("model = _render_decision_stage(run, presentation_mode=True)")\n'
          if source.count(old) != 1:
              raise RuntimeError("Expected one legacy guided-order assertion")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 .internal/align_order_test.py
          python .internal/align_order_test.py
      - name: Run focused review regression tests
        run: python -m pytest -q tests/test_competition_executive_ui.py tests/test_competition_usability_study.py tests/test_competition_app.py
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Compile and import applications
        run: |
          python -m compileall -q streamlit_app.py src tests
          python -c "import streamlit_app; import src.competition_executive_ui; import src.competition_usability_study"
      - name: Commit validated fixes to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/competition_executive_ui.py src/competition_usability_study.py streamlit_app.py tests/test_competition_executive_ui.py tests/test_competition_usability_study.py
          if (git diff --cached --quiet) { throw "No validated changes produced" }
          git commit -m "Address decision cockpit review findings"
          git push origin HEAD:feature/decision-cockpit-ui-v2
