name: one-shot-integrated-product-sprint

on:
  pull_request:
    branches:
      - feature/global-trade-copilot-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
          persist-credentials: true
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply integrated product sprint
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/tmp_patch_integrated_product_sprint.py *> integrated-patch.log
          exit $LASTEXITCODE
      - name: Upload integrated patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-patch-diagnostics
          path: integrated-patch.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content integrated-patch.log -Tail 20
          exit 1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run focused product tests
        id: focused
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q tests/test_product_matching.py tests/test_portfolio_assessment.py tests/test_official_data_hub.py tests/test_competition_portfolio_view.py *> focused-tests.log
          exit $LASTEXITCODE
      - name: Upload focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-focused-test-diagnostics
          path: focused-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after focused-test failure
        if: steps.focused.outcome == 'failure'
        shell: pwsh
        run: |
          Get-Content focused-tests.log -Tail 40
          exit 1
      - name: Run full tests except temporary repository-state readiness gate
        run: python -m pytest -q --ignore=tests/test_competition_readiness.py
      - name: Compile
        run: python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
      - name: Import applications
        run: python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - name: Validate intended diff
        shell: pwsh
        run: |
          $changed = git diff --name-only
          $allowed = @(
            'README.md',
            'competition_app.py',
            'data/reference/trade_finance_product_registry_v2.json',
            'docs/official_data_hub.md',
            'docs/portfolio_assessment.md',
            'src/competition_portfolio_view.py',
            'src/competition_product_view.py',
            'src/competition_readiness.py',
            'src/copilot_case.py',
            'src/intelligence/__init__.py',
            'src/intelligence/portfolio_assessment.py',
            'src/intelligence/product_matching.py',
            'src/official_data_hub.py',
            'src/portfolio_demo.py',
            'tests/test_competition_portfolio_view.py',
            'tests/test_competition_readiness.py',
            'tests/test_official_data_hub.py',
            'tests/test_portfolio_assessment.py',
            'tests/test_product_matching.py'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) {
              throw "Unexpected changed path: $path"
            }
          }
          if (-not $changed) {
            throw 'No integrated product changes were produced.'
          }
      - name: Commit verified integrated product sprint
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md competition_app.py data/reference/trade_finance_product_registry_v2.json docs/official_data_hub.md docs/portfolio_assessment.md src/competition_portfolio_view.py src/competition_product_view.py src/competition_readiness.py src/copilot_case.py src/intelligence/__init__.py src/intelligence/portfolio_assessment.py src/intelligence/product_matching.py src/official_data_hub.py src/portfolio_demo.py tests/test_competition_portfolio_view.py tests/test_competition_readiness.py tests/test_official_data_hub.py tests/test_portfolio_assessment.py tests/test_product_matching.py
          git commit -m 'Add portfolio, official data, and product v2 experience'
          git push origin HEAD:feature/global-trade-copilot-v2
