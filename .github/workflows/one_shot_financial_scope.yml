name: one-shot-financial-scope

on:
  pull_request:
    branches:
      - feature/global-trade-copilot-v2
    paths:
      - .automation/financial-scope-trigger.txt

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply repair
        run: python scripts/one_shot_financial_scope_fix.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run targeted tests
        run: python -m pytest -q tests/test_financial_trends.py
      - name: Run tests except repository-state readiness gate
        run: python -m pytest -q --ignore=tests/test_competition_readiness.py
      - name: Compile
        run: python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
      - name: Import applications
        run: python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - name: Validate diff
        run: git diff --check
      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/intelligence/financial_trends.py tests/test_financial_trends.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "Require verified scope for financial trend comparisons"
            git push origin HEAD:feature/global-trade-copilot-v2
          }
