name: temporary-official-case-layout-audit

on:
  pull_request:
    branches:
      - feature/global-trade-copilot-v2

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Verify canonical entrypoint and case contracts
        run: >-
          python -m pytest -q
          tests/test_official_case_studies.py
          tests/test_competition_case_study_view.py
          tests/test_public_entrypoint_sections.py
      - name: Install UI audit browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Render and inspect case layouts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $stdout = Join-Path $PWD 'artifacts/streamlit.stdout.log'
          $stderr = Join-Path $PWD 'artifacts/streamlit.stderr.log'
          $server = Start-Process python -ArgumentList @(
            '-m','streamlit','run','streamlit_app.py',
            '--server.headless=true','--server.address=127.0.0.1','--server.port=8501',
            '--browser.gatherUsageStats=false'
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8501/?presentation=true' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Streamlit did not become ready.' }
            python scripts/tmp_render_official_case_ui.py `
              --url 'http://127.0.0.1:8501/?presentation=true' `
              --output-dir artifacts
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Upload final layout audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-case-layout-audit
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
