name: temporary-final-release-gate

on:
  pull_request:
    branches:
      - release/v1.2.0-final-gate

permissions:
  contents: write

jobs:
  create-verified-release:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: b22356180b4f65843ffa996eac45275e0e34f8c7
      RELEASE_TAG: v1.2.0-competition
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b22356180b4f65843ffa996eac45275e0e34f8c7
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact release commit
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:TARGET_SHA) { throw "Expected $env:TARGET_SHA, got $actual" }
      - name: Create competition release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          @'
          # KB TradeGuard AI v1.2.0 Competition Release

          Final competition release pinned to commit `b22356180b4f65843ffa996eac45275e0e34f8c7`.

          ## Included
          - Deterministic single-transaction and multi-transaction portfolio assessment
          - 21 governed trade-finance consultation candidates
          - Seven official-data adapter surfaces and three pinned real public-data context cases
          - Fail-closed official-data refresh and transaction-capacity boundaries
          - Reviewed Decision Brief, Action Plan, audit exports, and grounded AI boundary
          - Desktop/mobile public competition interface

          ## Verification evidence
          - Exact-main public repository safety, competition readiness 1.6, 523 tests, compile-all, and application imports passed in run `30421816607`
          - Sanitized World Bank and UN Comtrade live smoke passed; secret-dependent KEXIM, Korea Customs, ECOS, OpenDART, and NTS paths were explicitly not configured
          - Public Streamlit Cloud deployment loaded the current three pinned public-data cases; browser screenshot evidence was captured in run `30422271330`
          - The Streamlit Cloud wrapper prevented a reliable top-level DOM selector verdict, so deployment evidence is recorded as browser-rendered visual verification rather than a selector-based automated assertion
          - Final Codex review produced no new findings and reacted 👍

          ## Boundary
          This is an independent competition prototype. It does not provide bank approval, executable pricing, product eligibility, legal advice, sanctions/AML clearance, insurance acceptance, guarantee issuance, or guaranteed outcomes.
          '@ | Set-Content -Encoding UTF8 release-notes.md
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:TARGET_SHA --title "KB TradeGuard AI v1.2.0 Competition Release" --notes-file release-notes.md
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:TARGET_SHA --title "KB TradeGuard AI v1.2.0 Competition Release" --notes-file release-notes.md
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url,tagName,targetCommitish,publishedAt | Out-File -Encoding utf8 artifacts/release.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-release-record
          path: artifacts/release.json
          if-no-files-found: error
          retention-days: 30
