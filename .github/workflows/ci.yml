name: deterministic-verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/public_repo_safety_check.py
      - run: python scripts/competition_readiness_check.py
      - run: python -m pytest -q
      - run: python -m compileall -q app.py copilot_app.py assessment_app.py pages src tests scripts
      - run: python -c "import app; import copilot_app; import assessment_app; import src"
