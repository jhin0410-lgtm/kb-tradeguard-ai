name: deterministic-verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Public repository safety
        shell: pwsh
        run: |
          python scripts/public_repo_safety_check.py > public_repo_safety_report.json
          $code = $LASTEXITCODE
          Get-Content public_repo_safety_report.json
          exit $code
      - name: Upload public safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-repo-safety-report
          path: public_repo_safety_report.json
          if-no-files-found: ignore
          retention-days: 7
      - run: python scripts/competition_readiness_check.py
      - name: Run pytest
        shell: pwsh
        run: |
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          exit $code
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
      - run: python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
      - name: Build clean submission source package
        run: python scripts/build_submission_package.py --output dist/KB-TradeGuard-AI-prototype.zip
      - name: Verify extracted submission runtime
        run: python scripts/verify_submission_package.py dist/KB-TradeGuard-AI-prototype.zip --start-app --timeout-seconds 60
      - name: Upload verified submission package
        uses: actions/upload-artifact@v4
        with:
          name: kb-tradeguard-submission-package
          path: dist/KB-TradeGuard-AI-prototype.zip
          if-no-files-found: error
          retention-days: 14
      - name: Capture actual unified product UI
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\capture_submission_ui.ps1 -OutputDir outputs/ui-captures
      - name: Upload actual UI captures
        uses: actions/upload-artifact@v4
        with:
          name: kb-tradeguard-ui-captures
          path: outputs/ui-captures
          if-no-files-found: error
          retention-days: 14
