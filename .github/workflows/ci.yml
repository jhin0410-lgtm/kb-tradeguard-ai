name: deterministic-verification

on:
  push:
    branches:
      - feature/global-trade-copilot-v2
  pull_request:

permissions:
  contents: write

concurrency:
  group: one-shot-stale-screening-repair-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply stale screening repair and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/intelligence/transaction_decision_brief.py')
          source = source_path.read_text(encoding='utf-8')
          if 'item.record_status == "stale" for item in screenings' not in source:
              lines = source.splitlines(keepends=True)
              needle = '    elif any(item.result == "not_screened" for item in screenings):\n'
              try:
                  index = lines.index(needle)
              except ValueError as exc:
                  raise SystemExit('not_screened coverage branch was not found') from exc
              lines[index:index] = [
                  '    elif any(item.record_status == "stale" for item in screenings):\n',
                  '        gaps.append(\n',
                  '            "compliance_screening: at least one related screening is stale and must be refreshed"\n',
                  '        )\n',
              ]
              source_path.write_text(''.join(lines), encoding='utf-8')
          print('stale screening coverage branch present')

          test_path = Path('tests/test_transaction_decision_brief.py')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'def test_stale_clear_screening_requires_refresh_before_favorable_disposition():'
          if test_name not in tests:
              marker = 'def test_complete_clear_case_returns_no_material_flags_with_explicit_limitation():'
              position = tests.find(marker)
              if position < 0:
                  raise SystemExit('clear-case test insertion point was not found')
              regression = '''def test_stale_clear_screening_requires_refresh_before_favorable_disposition():
              case = _case(
                  include_high_signals=False,
                  counterparty_status="professional_credit_investigation_completed",
              )
              stale_screening = case.trade_finance.compliance_screenings[0].model_copy(
                  update={"record_status": "stale"}
              )
              case = case.model_copy(
                  update={
                      "trade_finance": case.trade_finance.model_copy(
                          update={
                              "country_risk_facts": [
                                  case.trade_finance.country_risk_facts[0]
                              ],
                              "compliance_screenings": [
                                  stale_screening,
                                  *case.trade_finance.compliance_screenings[1:],
                              ],
                          }
                      )
                  }
              )

              brief = build_transaction_decision_brief(case, _request(case))

              assert brief.disposition == "additional_information_required"
              assert any(
                  item.startswith("compliance_screening") and "stale" in item
                  for item in brief.missing_information
              )


          '''
              test_path.write_text(
                  tests[:position] + regression + tests[position:],
                  encoding='utf-8',
              )
          print('stale screening regression test present')
          PY

      - name: Compile patched files
        run: python -m compileall -q src/intelligence/transaction_decision_brief.py tests/test_transaction_decision_brief.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run focused and full verification
        run: |
          python -m pytest -q tests/test_transaction_decision_brief.py
          python scripts/public_repo_safety_check.py
          python scripts/competition_readiness_check.py
          python -m pytest -q
          python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
          python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
          git diff --check

      - name: Commit verified repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/intelligence/transaction_decision_brief.py tests/test_transaction_decision_brief.py
          git commit -m 'Require fresh compliance screening coverage'
          git push origin HEAD:feature/global-trade-copilot-v2
