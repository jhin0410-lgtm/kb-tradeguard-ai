name: one-shot-nested-capacity-cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.base_ref == 'feature/global-trade-copilot-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-trade-copilot-v2
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python scripts/one_shot_stale_capacity_cleanup.py
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: |
          python -m pytest -q tests/test_single_transaction_pipeline.py
          python -m pytest -q
          python -m compileall -q app.py copilot_app.py assessment_app.py assessment_app_v2.py assessment_app_v2_mobile.py competition_app.py streamlit_app.py pages src tests scripts
          python -c "import app; import copilot_app; import assessment_app; import assessment_app_v2; import assessment_app_v2_mobile; import competition_app; import streamlit_app; import src"
          git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/intelligence/single_transaction_pipeline.py tests/test_single_transaction_pipeline.py
          git commit -m 'Clear stale capacity outputs when stage is skipped'
          git push origin HEAD:feature/global-trade-copilot-v2
